<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar juego</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <!-- Barra de navegacion -->
    <nav class="navbar navbar-expand-lg navbar-dark ">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Legendary Games</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Contacto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="agregarJuego.html">Agregar juego</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulario -->
    <form id="formulario">
        <input type="text" id="titulo" placeholder="Titulo*" autocomplete="off">
        <br>
        <input type="number" id="precio" placeholder="Precio*" autocomplete="off">
        <br>
        <input type="text" id="imagen" placeholder="URL de la imagen" autocomplete="off">
        <br>
        <input type="text" id="url" placeholder="Pagina del juego" autocomplete="off">
        <br>
        <textarea rows="10" cols="50"id="descripcion" placeholder="Descripcion" autocomplete="off"></textarea>
        <br>
        <input type="submit" value="Agregar" id="agregarJuego">
        <p>Los campos con * son obligatorios</p>
    </form>

    <script src="agregarJuego.js"></script>
</body>

</html>
