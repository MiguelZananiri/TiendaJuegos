<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Legendary Games</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="modal fade" id="modal-mensaje" data-bs-theme="dark" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true" data-bs-backdrop="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Mensaje</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="mensaje">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-carrito" data-bs-theme="dark" tabindex="-1" aria-labelledby="modal-carrito-label" aria-hidden="true" data-bs-backdrop="false">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modal-carrito-label">
                        Mi carrito
                    </h1>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body" id="contenido-carrito">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="limpiar-carrito">
                        Vaciar carrito
                    </button>

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Barra de navegacion -->
    <nav class="navbar navbar-expand-lg navbar-dark ">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Legendary Games</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="agregarJuego.html">Agregar juego</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Encabezado principal -->
    <header id="inicio">
        <h1 class="header-text">Legendary Games</h1>
        <p class="header-text">Tienda para comprar videojuegos en linea para PC</p>
    </header>
    <main>
        <!-- Carrusel de juegos -->
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3240220/4c8d7ce5142a528bdac68c093bd1bcc720e2baee/capsule_616x353_2x.jpg?t=1781187782"
                        class="d-block mx-auto img-fluid" alt="Imagen GTA V">
                </div>
                <div class="carousel-item">
                    <img src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3595270/862980706af9711b9c79ba4be6cb551d72f343a5/capsule_616x353_2x.jpg?t=1778886604"
                        class="d-block mx-auto img-fluid" alt="Imagen COD Modern Warfare III">
                </div>
                <div class="carousel-item">
                    <img src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/553850/f5a2d38e26fd1633b20debdb4dc121592d2faffd/capsule_616x353_spanish_2x.jpg?t=1788431424"
                        class="d-block mx-auto img-fluid" alt="Imagen Helldivers">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </main>

    <!-- Productos -->
    <section id="productos">
        <h2>Videojuegos en venta</h2>
        <form id="buscador">
            <input type="text" placeholder="Buscar juego" id="input-buscar" autocomplete="off">
            <input type="submit" value="Buscar" id="boton-buscar">
        </form>
        <div id="juegos">
        </div>

        <button class="boton" id="ver-carrito">Ver carrito</button>
    </section>

    <!-- Derechos, redes y contacto -->
    <footer id="contacto">
        <p>© 2026 Legendary Games. Todos los derechos reservados.</p>
        <p>legendarygames@contact.com</p>
        <p>Teléfono: 123-456-78</p>
        <div class="redes">
            <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer"><img
                    src="assets/img/youtube-logo.png" alt="Imagen Youtube"></a>
            <a href="https://x.com/?lang=es" target="_blank" rel="noopener noreferrer"><img src="assets/img/x-logo.png"
                    alt="Imagen X"></a>
            <a href="https://www.facebook.com/?locale=es_LA" target="_blank" rel="noopener noreferrer"><img
                    src="assets/img/facebook-logo.png" alt="Imagen Facebook"></a>
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="assets/js/juegos.js"></script>
</body>

</html>
